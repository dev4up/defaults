name: Build Downloadable Files

on:
  push:
    paths:
      - '.github/workflows/build-artifact.yml'
      - '.vscode/**'
      - 'settings.json'
      - '.editorconfig'
      - '.gitignore'
      - 'custom.d.ts'
      - 'jsconfig.json'
  workflow_dispatch:

jobs:
  package-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create downloadable archive
        run: |
          mkdir -p artifacts
          files=()

          if [[ -d .vscode ]]; then
            files+=(.vscode)
          fi

          for file in settings.json .editorconfig .gitignore custom.d.ts jsconfig.json; do
            if [[ -f "$file" ]]; then
              files+=("$file")
            fi
          done

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Erro: nenhum arquivo encontrado para empacotar." >&2
            exit 1
          fi

          tar -czf artifacts/downloadable-files.tar.gz "${files[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloadable-files
          path: artifacts/downloadable-files.tar.gz
